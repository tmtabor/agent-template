# The docs site. Its pages are generated from the repo's own files by docs/gen_pages.py (the README,
# AGENTS.md, CHANGELOG.md, CONTRIBUTING.md, MAINTAINING.md, each example, and the two hand-written
# guides in docs/pages/), so there is nothing to keep in sync by hand.
#   uv run --group docs mkdocs serve           # preview
#   uv run --group docs mkdocs build --strict  # what the Pages workflow runs
site_name: Agent Template
site_description: >-
  An opinionated template for building production-quality Pydantic AI agents, with a library of
  working example patterns.
site_url: https://tmtabor.io/agent-template/
repo_url: https://github.com/tmtabor/agent-template
repo_name: tmtabor/agent-template
docs_dir: docs

# Not published as they are: the implementation plans, the generator itself, and the hand-written
# guides (which are published at the paths the generator gives them). (The nav is set by the
# generator too, from the examples that exist.)
exclude_docs: |
  plans/
  pages/
  gen_pages.py
  __pycache__/

theme:
  name: material
  logo: assets/logo-header.svg
  favicon: assets/favicon.svg
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.tabs.link
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  - assets/extra.css

extra_javascript:
  - assets/extra.js

plugins:
  - search
  - gen-files:
      scripts:
        - docs/gen_pages.py

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details

# Anything that doesn't resolve is a warning, and the Pages build runs with --strict.
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
