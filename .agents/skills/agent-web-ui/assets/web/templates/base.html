<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Agent{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css" />
  <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="sidebar-title">Agent</div>
      <nav class="sidebar-nav">
        <a href="/" class="active">Chat</a>
        <!-- Add more nav links here as you add routes/pages. -->
      </nav>
    </aside>
    <main class="main">
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
