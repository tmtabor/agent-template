name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege — the job only reads the repo, so grant nothing else.
permissions:
  contents: read

# Cancel superseded runs when a PR branch is force-pushed or updated.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Both versions run to the end, so one failing does not hide the other.
      fail-fast: false
      matrix:
        # Keep in step with the classifiers in pyproject.toml and the README badge (tests/test_python_versions.py).
        python-version: ["3.13", "3.14"]
    env:
      # Makes `uv sync` and every `uv run` below use this interpreter, not the one in .python-version.
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v7

      # An exact version: setup-uv publishes no floating `v8`, `v9` or `v10` tag (only up to `v7`).
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      # The template ships no agents: add_agent.py creates them. A project built from the template
      # has agents of its own, so this check only runs in the template's own repository.
      - name: The template ships no agents
        if: github.repository == 'tmtabor/agent-template'
        run: |
          extra=$(ls agent/agents/*.py | grep -v '/__init__.py$' || true)
          test -z "$extra" || { echo "the template must ship no agents, found: $extra"; exit 1; }

      - name: Install dependencies
        run: uv sync --group dev

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      # Unit tests only — evals are excluded by the `-m 'not eval'` default
      # in pyproject.toml, so no API key or secrets are needed here.
      - name: Run tests
        run: uv run pytest
