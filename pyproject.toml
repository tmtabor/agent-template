[project]
name = "agent-template"
version = "0.3.0"
description = "Opinionated general-purpose AI agent template"
license = "BSD-3-Clause"
requires-python = ">=3.13"
# The versions CI tests and the release check has passed on. requires-python is the floor; this is the claim.
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "pydantic-ai>=2.54.0",
    "pydantic-settings>=2.15.0",
    "logfire>=5.1.1",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pydantic-evals>=2.54.0",
    "ruff>=0.16.10",
    "coverage>=7.16.2",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-gen-files>=0.6.1",
    "mkdocs-material>=9.7.7",
]

[tool.pytest.ini_options]
# scripts/ is not a package; this puts its modules (example_manifest, add_agent) on the path.
pythonpath = ["scripts"]
asyncio_mode = "auto"
# One event loop for the whole session: module-level agents keep a provider HTTP
# client that is bound to the loop it was first used in, so per-test loops make
# every later real model call (i.e. every eval after the first) fail with
# "Event loop is closed".
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"
markers = [
    "eval: marks tests as evals (require an API key; run with -m eval, skipped by default)",
]
addopts = "-m 'not eval'"

[tool.ruff]
line-length = 100
src = [".", "scripts"]
target-version = "py313"
# Skill scaffold payloads (e.g. .agents/skills/agent-web-ui/assets/) are
# templates copied into a *different*, future project — not this repo's own
# source. Linting them against this project's own known-first-party list
# (which has no idea about a "web" package that doesn't exist here) produces
# false-positive import-order errors having nothing to do with this repo.
#
# Recorded runs (examples/*/sample_run.md) are what a real model produced, including code it wrote, so they
# are kept verbatim. ruff formats Python inside Markdown, and would rewrite that code (say, its quotes),
# which made `ruff format --check` fail in CI after the code_mode transcript was re-recorded.
extend-exclude = [".agents/skills/*/assets", "examples/*/sample_run.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["agent", "examples", "example_manifest", "add_agent"]
combine-as-imports = true

# Line coverage of the example source (each agent, and the server of an example that ships one),
# measured over the offline and live (`eval`) tests together by scripts/release_check.py. Every
# line must be exercised.
[tool.coverage.run]
source = ["examples"]

[tool.coverage.report]
include = ["examples/*/agent.py", "examples/*/service/server.py"]
show_missing = true
skip_covered = false
fail_under = 100
